events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server app_instance1:3000 max_fails=3 fail_timeout=10s;
        server app_instance2:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8080 backup;
        keepalive 32;
    }

    # Main Website & Backend API Gateway: www.haatza.com
    server {
        listen 80;
        server_name www.haatza.com haatza.com;

        # Direct backend API proxying
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Static file uploads handling
        location /uploads/ {
            proxy_pass http://backend_servers/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # GCS Media Bucket Proxying
        location /media/ {
            proxy_pass https://storage.googleapis.com/haatza-media-bucket/;
            proxy_set_header Host storage.googleapis.com;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
        }


        # Main Shopping website static files / SPA fallback
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Shopping Subdomain: shopping.haatza.com
    server {
        listen 80;
        server_name shopping.haatza.com;

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # Seller Dashboard Subdomain: seller.haatza.com
    server {
        listen 80;
        server_name seller.haatza.com;

        location /api/ {
            proxy_pass http://backend_servers;
